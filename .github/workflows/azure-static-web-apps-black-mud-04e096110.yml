
name: Deploy frontend to Azure (black-mud)

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    # Pull requests are built and tested but are not deployed, avoiding use of
    # limited Static Web Apps staging-environment slots.
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js for pull request validation
        if: github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        if: github.event_name == 'pull_request'
        run: npm ci
      - name: Run tests
        if: github.event_name == 'pull_request'
        run: npm test -- --watchAll=false
      - name: Build pull request
        if: github.event_name == 'pull_request'
        run: npm run build
      - name: Verify deployment token
        if: github.event_name != 'pull_request'
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_MUD_04E096110 }}
        run: |
          if [ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]; then
            echo "::error::Repository secret AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_MUD_04E096110 is missing. Add the deployment token from the black-mud Azure Static Web App."
            exit 1
          fi
      - name: Get GitHub identity token
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string
      - name: Build And Deploy
        if: github.event_name != 'pull_request'
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_MUD_04E096110 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "build" # Built app content directory - optional
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_MUD_04E096110 }}
          action: "close"
