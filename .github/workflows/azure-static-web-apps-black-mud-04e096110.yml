
name: Deploy frontend to Azure (black-mud)

on:
  push:
    branches:
      - master
  pull_request:
    # Pull requests are built and tested but are not deployed, avoiding use of
    # limited Static Web Apps staging-environment slots.
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false
      - name: Set up Node.js for validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --watchAll=false
      - name: Build frontend
        env:
          REACT_APP_API_BASE_URL: https://scheduler-api-h2d8bfatb6f2bnhg.centralus-01.azurewebsites.net/api
        run: npm run build
      - name: Verify deployment token
        if: github.event_name != 'pull_request'
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_MUD_04E096110 }}
        run: |
          if [ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN" ]; then
            echo "::error::Repository secret AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_MUD_04E096110 is missing. Add the deployment token from the black-mud Azure Static Web App."
            exit 1
          fi
      - name: Get GitHub identity token
        if: github.event_name != 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        id: idtoken
        with:
          script: return await core.getIDToken()
          result-encoding: string
      - name: Build And Deploy
        if: github.event_name != 'pull_request'
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_BLACK_MUD_04E096110 }}
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "build" # Deploy the tested build
          api_location: "" # Api source code path - optional
          output_location: ""
          skip_app_build: true
          github_id_token: ${{ steps.idtoken.outputs.result }}
          ###### End of Repository/Build Configurations ######
